name: HMT Stock Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: .stock_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          MODE: once
          REQUEST_TIMEOUT_SECONDS: "12"
          STATE_FILE: .stock_state.json
          ALERT_ON_UNKNOWN: "false"

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          FORCE_TEST_EMAIL: ${{ secrets.FORCE_TEST_EMAIL }}

          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
        run: python watch_monitor.py

      - name: Save latest state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .stock_state.json
          key: stock-state-${{ github.run_id }}
